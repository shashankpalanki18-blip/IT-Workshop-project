<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASL Transcriber</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>ASL Sign Language Transcriber</h1>
        
        <!-- Wrapper added to align video and image side-by-side -->
        <div class="main-content" style="display: flex; justify-content: center; align-items: center; gap: 20px;">
            <div class="video-container">
                <!-- Video feed from webcam -->
                <video id="webcam" autoplay playsinline></video>
                <!-- Canvas to draw the tracking dots -->
                <canvas id="output_canvas"></canvas>
            </div>
            
            <!-- ASL Reference Picture -->
            <div class="image-container">
                <img src="{{ url_for('static', filename='ASL_PIC.jpg') }}" alt="ASL Signs" style="max-width: 40%; height: auto;">
            </div>
        </div>

        <h2>Predicted Letter: <span id="prediction">-</span></h2>
    </div>

    <!-- Load MediaPipe Tasks Vision for the web -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
    <script type="module" src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
